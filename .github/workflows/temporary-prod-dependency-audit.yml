name: Production Dependency Audit
on:
  push:
    branches: [audit/production-dependencies-20261109]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production packages
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log('Production:',JSON.stringify(a.metadata?.vulnerabilities)); for(const [name,v] of Object.entries(a.vulnerabilities||{})){ console.log(name+' | '+v.severity+' | direct:'+v.isDirect+' | fixes:'+JSON.stringify(v.fixAvailable)); }"
